[project]
name = "img-generator"
version = "0.1.0"
description = "Automated chart & diagram generator for Obsidian vault notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
generate-images = "main:main"

