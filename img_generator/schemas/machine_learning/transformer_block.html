<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Conteneur externe doux -->
  <rect x="70" y="60" width="540" height="570" class="container-dashed" />
  <text x="590" y="85" text-anchor="end" font-weight="bold" font-size="13" class="halo">Bloc Transformer Encoder (×N)</text>

  <!-- 1. ENTRÉE -->
  <g transform="translate(340, 665)">
    <text x="0" y="0" text-anchor="middle" font-weight="bold" font-size="13" class="halo">Entrée X (Tokens + Pos Embeddings)</text>
    <rect x="135" y="-13" width="75" height="18" class="badge" />
    <text x="172" y="0" text-anchor="middle" class="badge-text">(B, T, D)</text>
  </g>
  <line x1="340" y1="650" x2="340" y2="600" class="arrow" marker-end="url(#arrow)" />

  <!-- Point de départ Skip 1 -->
  <circle cx="340" cy="610" r="4" fill="#286044" />
  <!-- Courbe fluide de Skip Connection 1 (sans angle droit) -->
  <path d="M 340,610 C 130,610 130,435 250,435" class="arrow-dashed" marker-end="url(#arrow-soft)" />
  <text x="145" y="525" font-size="11" class="halo" fill="#4a8a6e">Skip Connection (Résiduel)</text>

  <!-- Multi-Head Attention Container -->
  <g transform="translate(220, 480)">
    <rect class="card" width="240" height="105" />
    <text x="120" y="28" text-anchor="middle" class="title halo">Multi-Head Attention</text>
    <text x="120" y="44" text-anchor="middle" class="subtitle">h têtes • dim = D/h</text>

    <!-- Sous-branches Q, K, V en forme de pilules douces -->
    <rect x="25" y="58" width="55" height="32" class="pill" />
    <text x="52" y="78" text-anchor="middle" font-weight="bold" font-size="12">Q</text>

    <rect x="92" y="58" width="55" height="32" class="pill" />
    <text x="119" y="78" text-anchor="middle" font-weight="bold" font-size="12">K</text>

    <rect x="160" y="58" width="55" height="32" class="pill" />
    <text x="187" y="78" text-anchor="middle" font-weight="bold" font-size="12">V</text>
  </g>

  <!-- Flèche vers Add & Norm 1 -->
  <line x1="340" y1="480" x2="340" y2="455" class="arrow" marker-end="url(#arrow)" />

  <!-- Add & LayerNorm 1 -->
  <g transform="translate(255, 415)">
    <rect class="pill-accent" width="170" height="38" />
    <text x="85" y="24" text-anchor="middle" font-weight="bold" font-size="12" fill="#ffffff">Add &amp; LayerNorm</text>
  </g>

  <!-- Flèche vers Feed Forward + départ Skip 2 -->
  <line x1="340" y1="415" x2="340" y2="345" class="arrow" marker-end="url(#arrow)" />
  <circle cx="340" cy="370" r="4" fill="#286044" />
  
  <!-- Courbe fluide de Skip Connection 2 (sans angle droit) -->
  <path d="M 340,370 C 130,370 130,195 250,195" class="arrow-dashed" marker-end="url(#arrow-soft)" />
  <text x="145" y="285" font-size="11" class="halo" fill="#4a8a6e">Skip Connection (Résiduel)</text>

  <!-- Bloc Feed Forward -->
  <g transform="translate(220, 245)">
    <rect class="card" width="240" height="90" />
    <text x="120" y="30" text-anchor="middle" class="title halo">Feed-Forward (FFN)</text>
    <text x="120" y="50" text-anchor="middle" class="subtitle">Linear (D → 4D) + GELU</text>
    <text x="120" y="68" text-anchor="middle" class="subtitle">Linear (4D → D) + Dropout</text>
  </g>

  <!-- Flèche vers Add & Norm 2 -->
  <line x1="340" y1="245" x2="340" y2="215" class="arrow" marker-end="url(#arrow)" />

  <!-- Add & LayerNorm 2 -->
  <g transform="translate(255, 175)">
    <rect class="pill-accent" width="170" height="38" />
    <text x="85" y="24" text-anchor="middle" font-weight="bold" font-size="12" fill="#ffffff">Add &amp; LayerNorm</text>
  </g>

  <!-- Flèche finale -->
  <line x1="340" y1="175" x2="340" y2="105" class="arrow" marker-end="url(#arrow)" />

  <!-- 3. SORTIE -->
  <g transform="translate(340, 40)">
    <text x="0" y="0" text-anchor="middle" font-weight="bold" font-size="13" class="halo">Sortie Z (Context Embeddings)</text>
    <rect x="125" y="-13" width="75" height="18" class="badge" />
    <text x="162" y="0" text-anchor="middle" class="badge-text">(B, T, D)</text>
  </g>
</svg>
