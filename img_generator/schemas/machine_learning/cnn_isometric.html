<svg width="850" height="380" viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286044" />
    </marker>
  </defs>

  <!-- Titre -->
  <text x="425" y="35" text-anchor="middle" font-weight="bold" font-size="16" class="halo">Architecture CNN : Extraction d'attributs et Projection 2D/3D</text>

  <!-- 1. IMAGE D'ENTRÉE (2D projetée en fausse 3D) -->
  <g transform="translate(60, 100)">
    <!-- Face image 28x28 -->
    <polygon points="0,0 30,-20 30,140 0,160" fill="rgba(195, 221, 210, 0.5)" stroke="#286044" stroke-width="2" />
    <!-- Grille de pixels interne -->
    <line x1="10" y1="-7" x2="10" y2="153" stroke="#a9c2b8" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="20" y1="-13" x2="20" y2="147" stroke="#a9c2b8" stroke-width="1" stroke-dasharray="2 2" />
    <!-- Noyau Conv 3x3 sur l'image -->
    <polygon id="kernel" points="8,40 18,33 18,53 8,60" fill="#286044" stroke="#ffffff" stroke-width="1" />
    <text x="15" y="190" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Image 28×28</text>
    <text x="15" y="206" text-anchor="middle" class="subtext">1 canal</text>
  </g>

  <!-- PYRAMIDE DE CONVOLUTION (lignes de projection vers la couche suivante) -->
  <!-- Depuis les 4 coins du noyau (68+8=76, 140) vers un point cible (240, 150) -->
  <polygon points="78,133 78,160 250,165 250,158" fill="rgba(40, 96, 68, 0.15)" />
  <line x1="78" y1="133" x2="250" y2="158" stroke="#286044" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="78" y1="160" x2="250" y2="165" stroke="#286044" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Annotation au-dessus de la flèche de convolution -->
  <text x="160" y="125" text-anchor="middle" font-weight="bold" font-size="11" class="halo" fill="#286044">Conv 3×3 + ReLU</text>

  <!-- 2. COUCHE CONV 1 (Volume 3D : 24x24 x 8 filtres) -->
  <g transform="translate(240, 90)">
    <!-- Face arrière / volume -->
    <!-- Tranche 1 (profondeur) -->
    <polygon points="40,-25 80,-25 80,115 40,115" fill="#4a8a6e" stroke="#286044" stroke-width="1.5" />
    <!-- Face supérieure -->
    <polygon points="0,0 40,-25 80,-25 40,0" fill="#7fb39a" stroke="#286044" stroke-width="1.5" />
    <!-- Face avant principale -->
    <polygon points="0,0 40,0 40,140 0,140" fill="#c3ddd2" stroke="#286044" stroke-width="2" />
    <polygon points="40,0 80,-25 80,115 40,140" fill="#7fb39a" stroke="#286044" stroke-width="1.5" />

    <!-- Patch MaxPool -->
    <rect x="15" y="35" width="14" height="14" fill="#286044" stroke="#ffffff" stroke-width="1" />
    <text x="40" y="170" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Feature Maps</text>
    <text x="40" y="186" text-anchor="middle" class="subtext">24×24 × 8 canaux</text>
  </g>

  <!-- Flèche Pooling -->
  <line x1="335" y1="160" x2="395" y2="160" class="arrow" marker-end="url(#arrow)" />
  <text x="365" y="145" text-anchor="middle" font-weight="bold" font-size="11" class="halo">MaxPool 2×2</text>

  <!-- 3. COUCHE CONV 2 (Volume plus profond mais plus petit : 12x12 x 16 filtres) -->
  <g transform="translate(415, 110)">
    <!-- Face supérieure -->
    <polygon points="0,0 30,-18 90,-18 60,0" fill="#7fb39a" stroke="#286044" stroke-width="1.5" />
    <!-- Face latérale -->
    <polygon points="60,0 90,-18 90,72 60,90" fill="#4a8a6e" stroke="#286044" stroke-width="1.5" />
    <!-- Face avant -->
    <polygon points="0,0 60,0 60,90 0,90" fill="#c3ddd2" stroke="#286044" stroke-width="2" />

    <text x="45" y="125" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Conv + Pool</text>
    <text x="45" y="141" text-anchor="middle" class="subtext">12×12 × 16 canaux</text>
  </g>

  <!-- Flèche Flatten -->
  <line x1="520" y1="160" x2="575" y2="160" class="arrow" marker-end="url(#arrow)" />
  <text x="548" y="145" text-anchor="middle" font-weight="bold" font-size="11" class="halo">Flatten</text>

  <!-- 4. COUCHE DENSE / FULLY CONNECTED -->
  <g transform="translate(595, 75)">
    <!-- Vecteur 1D vertical -->
    <rect x="0" y="0" width="22" height="170" class="box" rx="4" ry="4" />
    <!-- Neurones individuels -->
    <circle cx="11" cy="20" r="5" fill="#286044" />
    <circle cx="11" cy="40" r="5" fill="#4a8a6e" />
    <circle cx="11" cy="60" r="5" fill="#7fb39a" />
    <circle cx="11" cy="85" r="2" fill="#286044" />
    <circle cx="11" cy="95" r="2" fill="#286044" />
    <circle cx="11" cy="105" r="2" fill="#286044" />
    <circle cx="11" cy="130" r="5" fill="#7fb39a" />
    <circle cx="11" cy="150" r="5" fill="#286044" />

    <text x="11" y="200" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Dense</text>
    <text x="11" y="216" text-anchor="middle" class="subtext">128 neurones</text>
  </g>

  <!-- Flèche Softmax -->
  <line x1="630" y1="160" x2="685" y2="160" class="arrow" marker-end="url(#arrow)" />

  <!-- 5. SORTIE (Probabilités de classe) -->
  <g transform="translate(705, 85)">
    <!-- Barres de probabilités -->
    <rect x="0" y="10" width="80" height="18" fill="rgba(195, 221, 210, 0.4)" rx="3" />
    <rect x="0" y="10" width="15" height="18" fill="#4a8a6e" rx="3" />
    <text x="90" y="24" font-size="11" class="halo">0: 8%</text>

    <rect x="0" y="38" width="80" height="18" fill="rgba(195, 221, 210, 0.4)" rx="3" />
    <rect x="0" y="38" width="68" height="18" fill="#286044" rx="3" />
    <text x="90" y="52" font-size="11" font-weight="bold" class="halo">1: 85%</text>

    <rect x="0" y="66" width="80" height="18" fill="rgba(195, 221, 210, 0.4)" rx="3" />
    <rect x="0" y="66" width="6" height="18" fill="#4a8a6e" rx="3" />
    <text x="90" y="80" font-size="11" class="halo">2: 2%</text>

    <text x="35" y="120" text-anchor="middle" class="subtext">⋮</text>

    <text x="40" y="160" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Softmax (0-9)</text>
  </g>
</svg>
