<svg width="680" height="180" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Ligne de guidage douce -->
  <line x1="50" y1="90" x2="630" y2="90" class="grid-line" />

  <!-- Étape 1 : Dataset -->
  <g transform="translate(40, 55)">
    <!-- rx="35" sur une hauteur de 70px = vraie capsule 100% ronde -->
    <rect rx="35" ry="35" class="pill" width="160" height="70" />
    <text x="80" y="36" text-anchor="middle" font-weight="bold" font-size="14" fill="#286044">Dataset Brut</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="#4a8a6e">CSV / Parquet</text>
  </g>

  <!-- Connecteur fluide 1 -> 2 -->
  <line x1="205" y1="90" x2="255" y2="90" class="arrow" marker-end="url(#arrow)" />

  <!-- Étape 2 : Entraînement (Accent vert doux) -->
  <g transform="translate(260, 55)">
    <rect rx="35" ry="35" class="pill-accent" width="160" height="70" />
    <text x="80" y="36" text-anchor="middle" font-weight="bold" font-size="14" fill="#286044">Entraînement</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="#4a8a6e">Backprop &amp; AdamW</text>
  </g>

  <!-- Connecteur fluide 2 -> 3 -->
  <line x1="425" y1="90" x2="475" y2="90" class="arrow" marker-end="url(#arrow)" />

  <!-- Étape 3 : Inférence -->
  <g transform="translate(480, 55)">
    <rect rx="35" ry="35" class="pill" width="160" height="70" />
    <text x="80" y="36" text-anchor="middle" font-weight="bold" font-size="14" fill="#286044">Inférence</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="#4a8a6e">API REST / WASM</text>
  </g>
</svg>
