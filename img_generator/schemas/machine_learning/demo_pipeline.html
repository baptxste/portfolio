<svg width="650" height="180" viewBox="0 0 650 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Ligne de flux en arrière-plan -->
  <line x1="60" y1="90" x2="590" y2="90" class="grid-line" />

  <!-- Étape 1 : Dataset -->
  <g transform="translate(40, 50)">
    <rect class="pill" width="150" height="80" />
    <text x="75" y="42" text-anchor="middle" font-weight="bold" font-size="13" class="halo">Dataset Brut</text>
    <text x="75" y="58" text-anchor="middle" class="subtitle">CSV / Parquet</text>
  </g>

  <!-- Connecteur fluide 1 -> 2 -->
  <line x1="195" y1="90" x2="245" y2="90" class="arrow" marker-end="url(#arrow)" />

  <!-- Étape 2 : Entraînement -->
  <g transform="translate(250, 50)">
    <rect class="pill-accent" width="160" height="80" />
    <text x="80" y="42" text-anchor="middle" font-weight="bold" font-size="13" fill="#ffffff">Entraînement</text>
    <text x="80" y="58" text-anchor="middle" font-size="11" fill="#c3ddd2">Backprop &amp; AdamW</text>
  </g>

  <!-- Connecteur fluide 2 -> 3 -->
  <line x1="415" y1="90" x2="465" y2="90" class="arrow" marker-end="url(#arrow)" />

  <!-- Étape 3 : Inférence -->
  <g transform="translate(470, 50)">
    <rect class="pill" width="150" height="80" />
    <text x="75" y="42" text-anchor="middle" font-weight="bold" font-size="13" class="halo">Inférence</text>
    <text x="75" y="58" text-anchor="middle" class="subtitle">API REST / WASM</text>
  </g>
</svg>
