<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Titre -->
  <text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="15" class="halo">Processus de Décision Markovien (MDP) &amp; Boucle RL</text>

  <!-- 1. BLOC AGENT (Haut) -->
  <g transform="translate(180, 60)">
    <rect class="card" width="400" height="110" />
    <text x="200" y="30" text-anchor="middle" class="title halo">AGENT</text>
    
    <!-- Sous-composants internes arrondis -->
    <rect x="30" y="48" width="160" height="45" class="pill" />
    <text x="110" y="68" text-anchor="middle" font-weight="bold" font-size="12">Politique π(a | s)</text>
    <text x="110" y="82" text-anchor="middle" class="subtitle">Choix de l'action</text>

    <rect x="210" y="48" width="160" height="45" class="pill" />
    <text x="290" y="68" text-anchor="middle" font-weight="bold" font-size="12">Valeur V(s) / Q(s,a)</text>
    <text x="290" y="82" text-anchor="middle" class="subtitle">Gain espéré cumulé</text>
  </g>

  <!-- 2. BLOC ENVIRONNEMENT (Bas) -->
  <g transform="translate(180, 280)">
    <rect class="card" width="400" height="115" />
    <text x="200" y="30" text-anchor="middle" class="title halo">ENVIRONNEMENT</text>
    
    <!-- Mini diagramme de transition d'états fluide -->
    <circle cx="100" cy="72" r="22" class="node" />
    <text x="100" y="77" text-anchor="middle" font-weight="bold" font-size="13" fill="#ffffff">s_t</text>

    <circle cx="290" cy="72" r="22" class="node" />
    <text x="290" y="77" text-anchor="middle" font-weight="bold" font-size="13" fill="#ffffff">s_{t+1}</text>

    <!-- Transition probabiliste courbée -->
    <path d="M 122,66 C 165,42 225,42 268,66" class="arrow" marker-end="url(#arrow)" />
    <text x="195" y="44" text-anchor="middle" font-size="11" class="halo" font-style="italic">P(s_{t+1} | s_t, a_t)</text>

    <!-- Boucle retour fluide -->
    <path d="M 268,80 C 225,102 165,102 122,80" class="arrow-dashed" marker-end="url(#arrow-soft)" />
  </g>

  <!-- FLÈCHE 1 : ACTION (Courbe continue fluide sans angle droit) -->
  <path d="M 580,115 C 720,115 720,335 580,335" class="arrow" stroke-width="2.5" marker-end="url(#arrow)" />
  <g transform="translate(670, 225)">
    <rect x="-65" y="-14" width="130" height="28" class="badge" />
    <text x="0" y="4" text-anchor="middle" class="badge-text" font-size="12">Action a_t ∈ A</text>
  </g>

  <!-- FLÈCHE 2 : ÉTAT s_{t+1} (Courbe continue fluide) -->
  <path d="M 180,320 C 50,320 50,140 180,140" class="arrow" stroke-width="2" marker-end="url(#arrow)" />
  <g transform="translate(90, 210)">
    <rect x="-60" y="-12" width="120" height="24" class="badge" />
    <text x="0" y="4" text-anchor="middle" class="badge-text">État s_{t+1} ∈ S</text>
  </g>

  <!-- FLÈCHE 3 : RÉCOMPENSE r_{t+1} (Courbe plus large) -->
  <path d="M 180,355 C 10,355 10,95 180,95" class="arrow-dashed" stroke-width="1.8" marker-end="url(#arrow-soft)" />
  <g transform="translate(55, 255)">
    <rect x="-55" y="-12" width="110" height="24" class="badge" fill="#4a8a6e" />
    <text x="0" y="4" text-anchor="middle" class="badge-text">Gain r_{t+1} ∈ ℝ</text>
  </g>

  <!-- Objectif mathématique au centre dans une pilule douce -->
  <g transform="translate(380, 225)">
    <rect x="-140" y="-18" width="280" height="36" class="pill" />
    <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="12" class="halo">Max 𝔼 [ ∑_{k=0}^∞ γ^k r_{t+k+1} ]</text>
  </g>
</svg>
