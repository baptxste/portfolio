<svg width="1120" height="460" viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg">
  <!-- Titre Principal (Vert sapin officiel, sans aucun noir) -->
  <text x="560" y="32" text-anchor="middle" font-weight="bold" font-size="16" fill="#286044" class="halo">Architecture Data Lakehouse : Des Sources Multiples à la Donnée Gold</text>

  <!-- ===================================================================
       1. SOURCES MULTIPLES (Formes variées : Cylindre 3 disques, Document, Tuyau, Cube)
       =================================================================== -->
  <g transform="translate(30, 60)">
    <!-- Cadre de groupement doux -->
    <rect rx="22" ry="22" class="container-dashed" width="195" height="370" />
    <text x="97" y="24" text-anchor="middle" class="title">Sources Hétérogènes</text>

    <!-- Source 1 : Pile de 3 disques de base de données (PostgreSQL) -->
    <g transform="translate(15, 42)">
      <!-- Fond carte douce -->
      <rect rx="14" ry="14" class="card" width="165" height="62" />
      <!-- Cylindre 3 plateaux de disques -->
      <g transform="translate(14, 12)">
        <!-- Disque bas -->
        <path d="M 0,22 A 13,5 0 0,0 26,22 L 26,30 A 13,5 0 0,1 0,30 Z" fill="#ffffff" stroke="#286044" stroke-width="1.4" />
        <!-- Disque milieu -->
        <path d="M 0,14 A 13,5 0 0,0 26,14 L 26,22 A 13,5 0 0,1 0,22 Z" fill="#d4e9e2" stroke="#286044" stroke-width="1.4" />
        <!-- Disque haut -->
        <ellipse cx="13" cy="8" rx="13" ry="5" fill="#286044" />
        <path d="M 0,8 A 13,5 0 0,0 26,8 L 26,14 A 13,5 0 0,1 0,14 Z" fill="#ffffff" stroke="#286044" stroke-width="1.4" />
      </g>
      <text x="55" y="28" font-weight="bold" font-size="12" fill="#286044">PostgreSQL</text>
      <text x="55" y="44" class="subtitle">Tables SQL relationnelles</text>
    </g>

    <!-- Source 2 : Document avec coin biseauté (MongoDB) -->
    <g transform="translate(15, 120)">
      <rect rx="14" ry="14" class="card" width="165" height="62" />
      <!-- Icône feuille document biseautée (dog-ear) -->
      <g transform="translate(16, 15)">
        <polygon points="0,0 18,0 26,8 26,32 0,32" fill="#d4e9e2" stroke="#286044" stroke-width="1.4" />
        <polygon points="18,0 18,8 26,8" fill="#ffffff" stroke="#286044" stroke-width="1.2" />
        <line x1="5" y1="14" x2="18" y2="14" stroke="#286044" stroke-width="1" />
        <line x1="5" y1="20" x2="20" y2="20" stroke="#286044" stroke-width="1" />
        <line x1="5" y1="26" x2="14" y2="26" stroke="#286044" stroke-width="1" />
      </g>
      <text x="55" y="28" font-weight="bold" font-size="12" fill="#286044">MongoDB</text>
      <text x="55" y="44" class="subtitle">Collections BSON / NoSQL</text>
    </g>

    <!-- Source 3 : Tuyau / Capsule de Streaming avec pulses (Kafka) -->
    <g transform="translate(15, 198)">
      <rect rx="14" ry="14" class="card" width="165" height="62" />
      <!-- Tuyau / Queue avec paquets en transit -->
      <g transform="translate(14, 20)">
        <rect x="0" y="4" width="30" height="16" rx="8" ry="8" fill="#d4e9e2" stroke="#286044" stroke-width="1.4" />
        <circle cx="8" cy="12" r="3" fill="#286044" />
        <circle cx="15" cy="12" r="3" fill="#4a8a6e" />
        <circle cx="22" cy="12" r="3" fill="#10b981" />
      </g>
      <text x="55" y="28" font-weight="bold" font-size="12" fill="#286044">Kafka Stream</text>
      <text x="55" y="44" class="subtitle">Files de messages &amp; CDC</text>
    </g>

    <!-- Source 4 : Cube isométrique de stockage objet (S3) -->
    <g transform="translate(15, 276)">
      <rect rx="14" ry="14" class="card" width="165" height="62" />
      <!-- Cube isométrique 3D stylisé -->
      <g transform="translate(16, 17)">
        <!-- Face haut -->
        <polygon points="13,0 26,6 13,12 0,6" fill="#7fb39a" stroke="#286044" stroke-width="1.2" />
        <!-- Face gauche -->
        <polygon points="0,6 13,12 13,26 0,20" fill="#d4e9e2" stroke="#286044" stroke-width="1.2" />
        <!-- Face droite -->
        <polygon points="13,12 26,6 26,20 13,26" fill="#4a8a6e" stroke="#286044" stroke-width="1.2" />
      </g>
      <text x="55" y="28" font-weight="bold" font-size="12" fill="#286044">Stockage S3</text>
      <text x="55" y="44" class="subtitle">Parquet, Avro &amp; CSV</text>
    </g>
  </g>

  <!-- Connecteurs fluides vers Bronze -->
  <path d="M 225,133 C 255,133 255,245 285,245" class="arrow" marker-end="url(#arrow)" />
  <path d="M 225,211 C 250,211 255,245 285,245" class="arrow" marker-end="url(#arrow)" />
  <path d="M 225,289 C 250,289 255,245 285,245" class="arrow" marker-end="url(#arrow)" />
  <path d="M 225,367 C 255,367 255,245 285,245" class="arrow" marker-end="url(#arrow)" />

  <!-- ===================================================================
       2. ARCHITECTURE MÉDAILLON (Palier Cuivre/Bronze -> Argent/Silver -> Or/Gold)
       =================================================================== -->

  <!-- PALIER 1 : BRONZE (Container avec Header découpé) -->
  <g transform="translate(290, 105)">
    <!-- Corps principal -->
    <rect rx="18" ry="18" class="card-bronze" width="155" height="270" />
    <!-- Bandeau d'en-tête contrasté découpé -->
    <path d="M 0,18 A 18,18 0 0,1 18,0 L 137,0 A 18,18 0 0,1 155,18 L 155,50 L 0,50 Z" fill="#a87954" />
    <!-- Pastille numérotée 01 -->
    <circle cx="28" cy="25" r="11" fill="#ffffff" />
    <text x="28" y="29" text-anchor="middle" font-weight="bold" font-size="10" fill="#a87954">01</text>
    <text x="92" y="30" text-anchor="middle" font-weight="bold" font-size="13" fill="#ffffff">BRONZE</text>

    <!-- Contenu du corps -->
    <text x="77" y="78" text-anchor="middle" font-weight="bold" font-size="13" fill="#784f32">Données Brutes</text>
    <text x="77" y="96" text-anchor="middle" font-size="11" fill="#a87954">Ingestion Source</text>

    <line x1="20" y1="115" x2="135" y2="115" stroke="#d9beab" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="77" y="145" text-anchor="middle" font-size="11" fill="#784f32">• Format brut natif</text>
    <text x="77" y="172" text-anchor="middle" font-size="11" fill="#784f32">• Immuable / Append</text>
    <text x="77" y="199" text-anchor="middle" font-size="11" fill="#784f32">• Historique complet</text>
    <text x="77" y="226" text-anchor="middle" font-size="11" fill="#784f32">• Stockage illimité</text>
  </g>

  <!-- Connecteur Bronze → Silver avec label -->
  <g transform="translate(445, 225)">
    <path d="M 0,20 L 70,20" stroke="#5a7d8c" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow-soft)" />
    <text x="35" y="12" text-anchor="middle" font-size="9" font-weight="600" fill="#5a7d8c">Nettoyage &amp;</text>
    <text x="35" y="34" text-anchor="middle" font-size="9" fill="#5a7d8c">Validation</text>
  </g>

  <!-- PALIER 2 : SILVER (Container avec Header découpé argenté) -->
  <g transform="translate(520, 105)">
    <rect rx="18" ry="18" class="card-silver" width="155" height="270" />
    <!-- Bandeau argent -->
    <path d="M 0,18 A 18,18 0 0,1 18,0 L 137,0 A 18,18 0 0,1 155,18 L 155,50 L 0,50 Z" fill="#5a7d8c" />
    <!-- Pastille numérotée 02 -->
    <circle cx="28" cy="25" r="11" fill="#ffffff" />
    <text x="28" y="29" text-anchor="middle" font-weight="bold" font-size="10" fill="#5a7d8c">02</text>
    <text x="92" y="30" text-anchor="middle" font-weight="bold" font-size="13" fill="#ffffff">SILVER</text>

    <text x="77" y="78" text-anchor="middle" font-weight="bold" font-size="13" fill="#3c5966">Données Épurées</text>
    <text x="77" y="96" text-anchor="middle" font-size="11" fill="#5a7d8c">Nettoyé &amp; Enrichi</text>

    <line x1="20" y1="115" x2="135" y2="115" stroke="#b8ccd4" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="77" y="145" text-anchor="middle" font-size="11" fill="#3c5966">• Schémas uniformisés</text>
    <text x="77" y="172" text-anchor="middle" font-size="11" fill="#3c5966">• Données filtrées</text>
    <text x="77" y="199" text-anchor="middle" font-size="11" fill="#3c5966">• Tables consolidées</text>
    <text x="77" y="226" text-anchor="middle" font-size="11" fill="#3c5966">• Qualité vérifiée</text>
  </g>

  <!-- Connecteur Silver → Gold avec label -->
  <g transform="translate(675, 225)">
    <path d="M 0,20 L 70,20" stroke="#cba258" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow-gold)" />
    <text x="35" y="12" text-anchor="middle" font-size="9" font-weight="600" fill="#cba258">Agrégation &amp;</text>
    <text x="35" y="34" text-anchor="middle" font-size="9" fill="#cba258">Modélisation</text>
  </g>

  <!-- PALIER 3 : GOLD (Arche royale dorée, légèrement plus grande) -->
  <g transform="translate(745, 95)">
    <rect rx="20" ry="20" class="card-gold" width="165" height="290" />
    <!-- Bandeau Or -->
    <path d="M 0,20 A 20,20 0 0,1 20,0 L 145,0 A 20,20 0 0,1 165,20 L 165,52 L 0,52 Z" fill="#cba258" />
    <!-- Pastille numérotée 03 -->
    <circle cx="30" cy="26" r="12" fill="#ffffff" />
    <text x="30" y="30" text-anchor="middle" font-weight="bold" font-size="11" fill="#cba258">03</text>
    <text x="98" y="31" text-anchor="middle" font-weight="bold" font-size="14" fill="#ffffff">GOLD</text>

    <text x="82" y="82" text-anchor="middle" font-weight="bold" font-size="14" fill="#8c6b2d">Tables Métier</text>
    <text x="82" y="100" text-anchor="middle" font-size="11" fill="#cba258">Analytics &amp; Décision</text>

    <line x1="20" y1="120" x2="145" y2="120" stroke="#dfc49d" stroke-width="1.4" stroke-dasharray="3 3" />
    <text x="82" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#8c6b2d">• Schémas en Étoile</text>
    <text x="82" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#8c6b2d">• KPI Précalculés</text>
    <text x="82" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#8c6b2d">• Requêtes Sub-sec</text>
    <text x="82" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#8c6b2d">• Donnée Certifiée</text>
  </g>

  <!-- Connecteurs Gold vers Utilisateurs finaux -->
  <path d="M 910,240 C 935,240 935,160 955,160" class="arrow" stroke-width="2.2" marker-end="url(#arrow)" />
  <path d="M 910,240 C 935,240 935,240 955,240" class="arrow" stroke-width="2.2" marker-end="url(#arrow)" />
  <path d="M 910,240 C 935,240 935,320 955,320" class="arrow" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- ===================================================================
       3. CONSOMMATEURS (Moniteur BI avec pied, Graphe IA, Carte API)
       =================================================================== -->
  <g transform="translate(955, 95)">
    <!-- Consommateur 1 : Écran Moniteur BI avec pied -->
    <g transform="translate(0, 30)">
      <!-- Écran -->
      <rect rx="8" ry="8" class="pill" width="135" height="56" />
      <!-- Barres de graphiques internes -->
      <g transform="translate(14, 18)">
        <rect x="0" y="14" width="5" height="12" rx="1.5" fill="#cba258" />
        <rect x="8" y="6" width="5" height="20" rx="1.5" fill="#4a8a6e" />
        <rect x="16" y="0" width="5" height="26" rx="1.5" fill="#286044" />
      </g>
      <text x="75" y="26" font-weight="bold" font-size="11" fill="#286044">Tableau de Bord</text>
      <text x="75" y="42" class="subtitle">Metabase / Superset</text>
      <!-- Pied du moniteur -->
      <line x1="67" y1="56" x2="67" y2="62" stroke="#286044" stroke-width="2" />
      <line x1="55" y1="62" x2="80" y2="62" stroke="#286044" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Consommateur 2 : Réseau Neuronal IA (Triangle de nœuds connectés) -->
    <g transform="translate(0, 115)">
      <rect rx="14" ry="14" class="pill" width="135" height="56" />
      <!-- Triangle de neurones -->
      <g transform="translate(12, 16)">
        <line x1="4" y1="6" x2="20" y2="12" stroke="#7fb39a" stroke-width="1.2" />
        <line x1="4" y1="18" x2="20" y2="12" stroke="#7fb39a" stroke-width="1.2" />
        <circle cx="4" cy="6" r="3.5" fill="#286044" />
        <circle cx="4" cy="18" r="3.5" fill="#286044" />
        <circle cx="20" cy="12" r="4" fill="#10b981" />
      </g>
      <text x="75" y="26" font-weight="bold" font-size="11" fill="#286044">IA &amp; Machine Learning</text>
      <text x="75" y="42" class="subtitle">Feature Store &amp; RAG</text>
    </g>

    <!-- Consommateur 3 : API & End Users -->
    <g transform="translate(0, 195)">
      <rect rx="14" ry="14" class="pill-accent" width="135" height="56" />
      <!-- Icône prise / connecteur -->
      <g transform="translate(14, 20)">
        <circle cx="10" cy="8" r="7" fill="#ffffff" stroke="#286044" stroke-width="1.4" />
        <circle cx="10" cy="8" r="3" fill="#286044" />
      </g>
      <text x="75" y="26" font-weight="bold" font-size="11" fill="#286044">Applications &amp; Users</text>
      <text x="75" y="42" class="subtitle">API GraphQL &amp; REST</text>
    </g>
  </g>
</svg>
